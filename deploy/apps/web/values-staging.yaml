# web, staging. image.tag is bumped by .github/workflows/deploy.yml.
image:
  tag: "1.1.0"
# The public entry, behind Cloudflare's proxy and Access (docs/deploy.md section 2).
# TORII_PUBLIC_URL and TSUBAME_GMAIL_REDIRECT_URL in .secrets/staging.env and the
# Google redirect URIs must use https://shogun.sboy99.xyz.
ingress:
  enabled: true
  host: shogun.sboy99.xyz
  # TODO(owner): letsencrypt-prod once `kubectl -n shogun get certificate web-tls`
  # is Ready. Until then browsers reject the certificate, and so does Cloudflare's
  # Full (strict) mode.
  clusterIssuer: letsencrypt-staging
