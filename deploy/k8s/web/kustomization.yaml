# The web app for the cluster. Set the image you built and loaded:
#   (cd deploy/k8s/web && kustomize edit set image shogun-web=shogun-web:<tag>)
# Use a unique tag per build: kind keeps whatever image a node already has for
# a tag, so reusing one silently runs the old code.
resources:
  - deployment.yaml
  - service.yaml

images:
  - name: shogun-web
    newName: shogun-web
    newTag: local
