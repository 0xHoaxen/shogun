# Postgres 17 with pgvector for the cluster: the same image and bootstrap as
# deploy/compose/compose.yaml. The init files come from the ConfigMap that
# kustomization.yaml builds from deploy/compose/postgres/.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: shogun-postgres
  labels:
    app.kubernetes.io/name: shogun-postgres
    app.kubernetes.io/part-of: shogun
spec:
  serviceName: shogun-postgres
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: shogun-postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: shogun-postgres
        app.kubernetes.io/part-of: shogun
    spec:
      containers:
        - name: postgres
          image: pgvector/pgvector:pg17
          env:
            - name: POSTGRES_DB
              value: shogun
            # A subdirectory, because a fresh volume has a lost+found that
            # initdb refuses to start in.
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
            - name: SHOGUN_INIT_DIR
              value: /opt/shogun/postgres
          # POSTGRES_PASSWORD and one <NAME>_DB_PASSWORD per service; init.sh
          # creates a schema and a login role for every such variable. The
          # Secret is created by scripts/k8s-secrets.sh.
          envFrom:
            - secretRef:
                name: shogun-postgres
          ports:
            - name: postgres
              containerPort: 5432
          readinessProbe:
            exec:
              command: ["pg_isready", "-h", "localhost", "-U", "postgres", "-d", "shogun"]
            periodSeconds: 5
            failureThreshold: 20
          livenessProbe:
            exec:
              command: ["pg_isready", "-h", "localhost", "-U", "postgres", "-d", "shogun"]
            initialDelaySeconds: 30
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 1Gi
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            # The entrypoint runs this on an empty data directory only.
            - name: init
              mountPath: /docker-entrypoint-initdb.d/00-shogun.sh
              subPath: 00-shogun.sh
            # init.sql and service.sql, read through SHOGUN_INIT_DIR.
            - name: init
              mountPath: /opt/shogun/postgres
      volumes:
        - name: init
          configMap:
            name: shogun-postgres-init
            defaultMode: 0555
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 5Gi
