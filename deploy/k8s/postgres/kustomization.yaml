# Postgres for the cluster. The init files live in deploy/compose/postgres/ and
# are read from there so the bootstrap is not duplicated, which kustomize allows
# only with the load restrictor off:
#   kubectl kustomize --load-restrictor=LoadRestrictionsNone deploy/k8s/postgres \
#     | kubectl --context <ctx> -n <ns> apply -f -
# (kubectl apply -k has no such flag, so it fails on the paths below.)
# Needs the Secret shogun-postgres first; see scripts/k8s-secrets.sh.
resources:
  - service.yaml
  - statefulset.yaml

generatorOptions:
  disableNameSuffixHash: true

configMapGenerator:
  - name: shogun-postgres-init
    files:
      - 00-shogun.sh=../../compose/postgres/init.sh
      - init.sql=../../compose/postgres/init.sql
      - service.sql=../../compose/postgres/service.sql
