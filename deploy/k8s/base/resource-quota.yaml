# What the shogun namespace may ask for in total, sized for a 2 vCPU / 4 GiB VM
# that also runs k3s, cert-manager and the monitoring stack.
# Staging steady state is 650m CPU and 1 GiB of requests (ten services at
# 50m/64Mi, web 50m/128Mi, Postgres 100m/256Mi); the rest is room for a rolling
# update and a migration Job.
# TODO(owner): revisit after the first real deploy, and raise it with the VM.
# Production does not fit yet: its values ask for two replicas per service.
apiVersion: v1
kind: ResourceQuota
metadata:
  name: shogun
  namespace: shogun
spec:
  hard:
    requests.cpu: 1200m
    requests.memory: 1792Mi
    limits.memory: 5Gi
    pods: "25"
    persistentvolumeclaims: "3"
    requests.storage: 15Gi
