{{- /* Staging certificates are not trusted by browsers but have generous rate
limits; use it until the host and DNS are right, then switch the Ingress to
letsencrypt-prod. */ -}}
{{- $issuers := dict
  "letsencrypt-staging" "https://acme-staging-v02.api.letsencrypt.org/directory"
  "letsencrypt-prod" "https://acme-v02.api.letsencrypt.org/directory" }}
{{- range $name := list "letsencrypt-staging" "letsencrypt-prod" }}
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: {{ $name }}
  labels:
    {{- include "shogunIngress.labels" $ | nindent 4 }}
spec:
  acme:
    server: {{ get $issuers $name }}
    {{- with $.Values.acme.email }}
    email: {{ . | quote }}
    {{- end }}
    privateKeySecretRef:
      name: {{ $name }}-account
    solvers:
      - http01:
          ingress:
            ingressClassName: traefik
{{- end }}
