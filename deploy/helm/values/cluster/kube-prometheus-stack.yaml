# kube-prometheus-stack, once per cluster, namespace monitoring. Installed by
# scripts/platform.sh (chart version pinned there). The Shogun alert rules and
# dashboard come from deploy/helm/monitoring; the services' ServiceMonitors from
# serviceMonitor.enabled in their values.

# k3s runs the control plane inside its own process, so these endpoints are not
# scrapeable and their targets and alerts would always be down.
kubeControllerManager:
  enabled: false
kubeScheduler:
  enabled: false
kubeProxy:
  enabled: false
kubeEtcd:
  enabled: false
defaultRules:
  rules:
    etcd: false
    kubeControllerManager: false
    kubeProxy: false
    kubeSchedulerAlerting: false
    kubeSchedulerRecording: false
    windows: false

prometheus:
  prometheusSpec:
    # Pick up ServiceMonitors and PrometheusRules from every namespace, not only
    # those labelled with this release.
    serviceMonitorSelectorNilUsesHelmValues: false
    ruleSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    retention: 15d
    storageSpec:
      volumeClaimTemplate:
        spec:
          # k3s's default provisioner.
          storageClassName: local-path
          accessModes: [ReadWriteOnce]
          resources:
            requests:
              storage: 10Gi

# The chart's default route sends everything to its "null" receiver.
# TODO(owner): send alerts to email. Add an email receiver under
# alertmanager.config (address and SMTP settings, the password from a Secret
# through alertmanager.alertmanagerSpec.secrets, never in this file).
alertmanager:
  alertmanagerSpec:
    retention: 120h

grafana:
  # Login from Secret grafana-admin (admin-user, admin-password), created by
  # scripts/k8s-secrets.sh. Anonymous access stays off.
  admin:
    existingSecret: grafana-admin
  defaultDashboardsTimezone: browser
  # TODO(owner): once DNS points the host at the VM, enable it and set the host
  # in all three places:
  #   ingress.enabled: true, ingress.hosts: [grafana.example.com],
  #   ingress.tls[0].hosts: [grafana.example.com],
  #   grafana.ini.server.root_url: https://grafana.example.com
  # Switch the issuer to letsencrypt-prod once the staging certificate is issued.
  ingress:
    enabled: false
    ingressClassName: traefik
    annotations:
      cert-manager.io/cluster-issuer: letsencrypt-staging
    hosts: []
    tls:
      - secretName: grafana-tls
        hosts: []
