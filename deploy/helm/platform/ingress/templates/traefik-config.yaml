{{- if .Values.traefik.configure }}
# Merged by k3s into the values of its bundled Traefik chart. The redirections
# key needs Traefik chart 34 or newer:
#   kubectl -n kube-system get helmchart traefik -o jsonpath='{.spec.chart}'
# No access log: it records the full request path, and the OAuth callback
# carries its code in the query string.
apiVersion: helm.cattle.io/v1
kind: HelmChartConfig
metadata:
  name: traefik
  namespace: kube-system
  labels:
    {{- include "shogunIngress.labels" . | nindent 4 }}
spec:
  valuesContent: |-
    {{- if .Values.traefik.redirectToHttps }}
    ports:
      web:
        http:
          redirections:
            entryPoint:
              to: websecure
              scheme: https
              permanent: true
    {{- end }}
{{- end }}
