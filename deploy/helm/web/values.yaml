# Defaults for the web app chart. Per-environment values live in
# deploy/helm/values/<environment>/web.yaml.
#
# Next.js bakes its /api and /auth rewrites into the image at build time, so the
# image must be built with the in-cluster address of torii's public port:
#   docker build -f deploy/docker/web.Dockerfile \
#     --build-arg TORII_URL=http://torii:8081 -t <image>:<tag> web
# The chart cannot change that address.
image:
  # Empty means ghcr.io/0xhoaxen/web.
  repository: ""
  # Required.
  tag: ""
  pullPolicy: IfNotPresent

# Secrets for a private registry, for example [{name: ghcr}].
imagePullSecrets: []

replicaCount: 1

port: 3000

# Public HTTPS entry through Traefik, with a certificate from cert-manager (the
# issuers come from deploy/helm/ingress). The web app is the only thing exposed:
# it proxies /api and /auth to torii inside the cluster. TORII_PUBLIC_URL and the
# Google redirect URI must be https://<host>.
ingress:
  enabled: false
  className: traefik
  # Required when enabled, for example shogun.example.com.
  host: ""
  # letsencrypt-staging until the host resolves, then letsencrypt-prod.
  clusterIssuer: letsencrypt-staging

# Plain environment variables for the container.
env: {}

resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    memory: 384Mi

nodeSelector: {}
tolerations: []
affinity: {}
