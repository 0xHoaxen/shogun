{{- if .Values.ingress.enabled }}
{{- $host := required "values.ingress.host is required when the ingress is enabled" .Values.ingress.host }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "shogunWeb.fullname" . }}
  labels:
    {{- include "shogunWeb.labels" . | nindent 4 }}
  annotations:
    cert-manager.io/cluster-issuer: {{ .Values.ingress.clusterIssuer | quote }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  tls:
    - hosts:
        - {{ $host | quote }}
      secretName: {{ include "shogunWeb.fullname" . }}-tls
  rules:
    - host: {{ $host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "shogunWeb.fullname" . }}
                port:
                  name: http
{{- end }}
