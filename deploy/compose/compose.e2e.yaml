# End-to-end add-on: a stub OpenID provider in place of Google, so the web
# app's login can be exercised without a real account. Used by the CI
# e2e-compose job:
#   docker compose -f compose.yaml -f compose.e2e.yaml up -d --build --wait \
#     postgres kagami torii web mock-oauth2
#
# Torii checks that the provider's issuer equals GOOGLE_ISSUER_URL, and the
# mock derives its issuer from the request host. The browser therefore has to
# reach the provider as mock-oauth2 too; playwright.compose.config.ts maps that
# name to 127.0.0.1 inside Chromium, so no /etc/hosts entry is needed.
services:
  mock-oauth2:
    image: ghcr.io/navikt/mock-oauth2-server:6.0.4
    restart: unless-stopped
    environment:
      SERVER_PORT: "8080"
      # No login screen: every authorization is granted for the subject below.
      JSON_CONFIG: |
        {
          "interactiveLogin": false,
          "tokenCallbacks": [
            {
              "issuerId": "default",
              "requestMappings": [
                {
                  "requestParam": "code",
                  "match": "*",
                  "claims": {
                    "sub": "e2e-owner",
                    "email": "${TORII_E2E_EMAIL:-owner@example.com}",
                    "email_verified": true,
                    "name": "E2E Owner"
                  }
                }
              ]
            }
          ]
        }
    ports:
      - "127.0.0.1:8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/default/.well-known/openid-configuration || exit 1"]
      interval: 3s
      timeout: 3s
      retries: 20

  torii:
    depends_on:
      mock-oauth2:
        condition: service_healthy
    environment:
      GOOGLE_ISSUER_URL: http://mock-oauth2:8080/default
      GOOGLE_CLIENT_ID: e2e-client
      GOOGLE_CLIENT_SECRET: e2e-secret
      TORII_ALLOWED_EMAILS: ${TORII_E2E_EMAIL:-owner@example.com}

  # Stand-in for Anthropic and Gmail (see stubs/mock-apis.mjs). fude and
  # tsubame call it instead of the real services; the spec reads what it was
  # sent from /_e2e/sent. Host port 8091, because soroban already has 8090.
  mock-apis:
    image: node:22-alpine
    restart: unless-stopped
    command: ["node", "/stubs/mock-apis.mjs"]
    environment:
      PORT: "8090"
    volumes:
      - ./stubs:/stubs:ro
    ports:
      - "127.0.0.1:8091:8090"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8090/healthz || exit 1"]
      interval: 3s
      timeout: 3s
      retries: 20

  fude:
    depends_on:
      mock-apis:
        condition: service_healthy
    environment:
      ANTHROPIC_API_KEY: e2e-key
      ANTHROPIC_BASE_URL: http://mock-apis:8090

  tsubame:
    depends_on:
      mock-apis:
        condition: service_healthy
    environment:
      ANTHROPIC_API_KEY: e2e-key
      ANTHROPIC_BASE_URL: http://mock-apis:8090
      TSUBAME_GMAIL_API_BASE: http://mock-apis:8090
      TSUBAME_GMAIL_TOKEN_URL: http://mock-apis:8090/token
      # https because the web app follows nothing else; the spec intercepts it.
      TSUBAME_GMAIL_AUTH_URL: https://mock-gmail.test/authorize
