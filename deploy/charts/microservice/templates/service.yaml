apiVersion: v1
kind: Service
metadata:
  name: {{ include "microservice.name" . }}
  labels:
    {{- include "microservice.labels" . | nindent 4 }}
spec:
  selector:
    {{- include "microservice.selectorLabels" . | nindent 4 }}
  ports:
    {{- if .Values.ports.grpc }}
    - name: grpc
      port: {{ .Values.ports.grpc }}
      targetPort: grpc
    {{- end }}
    - name: http
      port: {{ .Values.ports.http }}
      targetPort: http
    {{- if .Values.publicPort.enabled }}
    - name: public
      port: {{ .Values.publicPort.port }}
      targetPort: public
    {{- end }}
