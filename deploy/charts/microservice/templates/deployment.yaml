apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "microservice.name" . }}
  labels:
    {{- include "microservice.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "microservice.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "microservice.labels" . | nindent 8 }}
    spec:
      {{- include "microservice.podSpecCommon" . | nindent 6 }}
      containers:
        - name: {{ .Values.containerName }}
          image: {{ include "microservice.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- include "microservice.containerSecurityContext" . | nindent 12 }}
          ports:
            {{- if .Values.ports.grpc }}
            - name: grpc
              containerPort: {{ .Values.ports.grpc }}
            {{- end }}
            - name: http
              containerPort: {{ .Values.ports.http }}
            {{- if .Values.publicPort.enabled }}
            - name: public
              containerPort: {{ .Values.publicPort.port }}
            {{- end }}
          {{- with (include "microservice.envBlock" . | trim) }}
          {{- . | nindent 10 }}
          {{- end }}
          livenessProbe:
            {{- toYaml .Values.probes.liveness | nindent 12 }}
          readinessProbe:
            {{- toYaml .Values.probes.readiness | nindent 12 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          {{- $mounts := .Values.volumeMounts }}
          {{- if .Values.internalTLS.enabled }}
          {{- $mounts = concat $mounts (include "microservice.tlsVolumeMounts" . | fromYamlArray) }}
          {{- end }}
          {{- with $mounts }}
          volumeMounts:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      {{- $volumes := .Values.volumes }}
      {{- if .Values.internalTLS.enabled }}
      {{- $volumes = concat $volumes (include "microservice.tlsVolumes" . | fromYamlArray) }}
      {{- end }}
      {{- with $volumes }}
      volumes:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
