{{- if .Values.backup.enabled }}
# The backup script is shared with Compose: files/backup.sh links to
# deploy/compose/backup/backup.sh.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "shogunPostgres.fullname" . }}-backup
  labels:
    {{- include "shogunPostgres.labels" . | nindent 4 }}
data:
  backup.sh: |
    {{- .Files.Get "files/backup.sh" | nindent 4 }}
{{- end }}
