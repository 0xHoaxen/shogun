{{- /* k3s enforces NetworkPolicy with its bundled kube-router. Off by default:
turn it on per namespace once the app has been seen working without it. */ -}}
{{- range .Values.namespaces }}
{{- if .defaultDenyIngress }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: {{ .name }}
spec:
  podSelector: {}
  policyTypes: [Ingress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-namespace-traefik-and-monitoring
  namespace: {{ .name }}
spec:
  podSelector: {}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: {}
        # k3s runs Traefik in kube-system.
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
{{- end }}
{{- end }}
