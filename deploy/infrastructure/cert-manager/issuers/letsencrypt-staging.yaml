# Staging certificates are not trusted by browsers but have generous rate
# limits: use this issuer until the host and DNS are right, then switch the
# Ingress to letsencrypt-prod. Release cluster-issuers, after cert-manager.
# TODO(owner): add spec.acme.email if you want a contact on the account (optional;
# Let's Encrypt no longer sends expiry mail).
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-staging
  labels:
    app.kubernetes.io/part-of: shogun
spec:
  acme:
    server: https://acme-staging-v02.api.letsencrypt.org/directory
    privateKeySecretRef:
      name: letsencrypt-staging-account
    # DNS-01 through Cloudflare: the web host sits behind Cloudflare's proxy and
    # Access, and the VM accepts 80/443 from Cloudflare only, so Let's Encrypt
    # cannot reach an HTTP-01 challenge. The token (Zone DNS Edit on this zone)
    # is sealed by make seal from CLOUDFLARE_API_TOKEN.
    solvers:
      - dns01:
          cloudflare:
            apiTokenSecretRef:
              name: cloudflare-api-token
              key: api-token
