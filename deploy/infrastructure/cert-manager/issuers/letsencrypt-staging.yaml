# Staging certificates are not trusted by browsers but have generous rate
# limits: use this issuer until the host and DNS are right, then switch the
# Ingress to letsencrypt-prod. Applied after cert-manager (phase platform).
# TODO(owner): add spec.acme.email if you want a contact on the account (optional;
# Let's Encrypt no longer sends expiry mail).
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-staging
  labels:
    app.kubernetes.io/part-of: shogun
spec:
  acme:
    server: https://acme-staging-v02.api.letsencrypt.org/directory
    privateKeySecretRef:
      name: letsencrypt-staging-account
    solvers:
      - http01:
          ingress:
            ingressClassName: traefik
