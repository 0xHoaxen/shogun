# Trusted certificates with strict rate limits: switch to this issuer once
# letsencrypt-staging has issued for the host. Applied after cert-manager
# (phase platform).
# TODO(owner): add spec.acme.email if you want a contact on the account (optional;
# Let's Encrypt no longer sends expiry mail).
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
  labels:
    app.kubernetes.io/part-of: shogun
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    privateKeySecretRef:
      name: letsencrypt-prod-account
    solvers:
      - http01:
          ingress:
            ingressClassName: traefik
