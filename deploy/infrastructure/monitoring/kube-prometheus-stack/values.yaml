# Values for the upstream kube-prometheus-stack chart (Prometheus, Alertmanager,
# Grafana), release `monitoring` in namespace monitoring. The chart version is
# pinned in helmfile.yaml.gotmpl; per-environment overrides go in
# values-<env>.yaml.
#
# Shogun's alert rules and dashboard are the separate monitoring-extras release
# (deploy/charts/monitoring-extras), which links to the Compose files. The
# services' ServiceMonitors come from serviceMonitor.enabled in their values.

# k3s runs the control plane inside its own process, so these endpoints are not
# scrapeable and their targets and alerts would always be down.
kubeControllerManager:
  enabled: false
kubeScheduler:
  enabled: false
kubeProxy:
  enabled: false
kubeEtcd:
  enabled: false
defaultRules:
  rules:
    etcd: false
    kubeControllerManager: false
    kubeProxy: false
    kubeSchedulerAlerting: false
    kubeSchedulerRecording: false
    windows: false

# Requests are small and explicit, sized for a 2 vCPU / 4 GiB VM that also runs
# the app. Raise them if the VM grows.
prometheusOperator:
  resources:
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      memory: 192Mi

kube-state-metrics:
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      memory: 128Mi

prometheus-node-exporter:
  resources:
    requests:
      cpu: 10m
      memory: 24Mi
    limits:
      memory: 64Mi

prometheus:
  prometheusSpec:
    # Pick up ServiceMonitors and PrometheusRules from every namespace, not only
    # those labelled with this release.
    serviceMonitorSelectorNilUsesHelmValues: false
    ruleSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    retention: 7d
    resources:
      requests:
        cpu: 100m
        memory: 384Mi
      limits:
        memory: 1Gi
    storageSpec:
      volumeClaimTemplate:
        spec:
          # No storageClassName: the cluster default (k3s "local-path", kind
          # "standard"), as for the Postgres volumes.
          accessModes: [ReadWriteOnce]
          resources:
            requests:
              storage: 5Gi

# The chart's default route sends everything to its "null" receiver.
# TODO(owner): send alerts to email. Add an email receiver under
# alertmanager.config (address and SMTP settings, the password from a Secret
# through alertmanager.alertmanagerSpec.secrets, never in this file).
alertmanager:
  alertmanagerSpec:
    retention: 120h
    resources:
      requests:
        cpu: 10m
        memory: 48Mi
      limits:
        memory: 128Mi

grafana:
  # Login from Secret grafana-admin (admin-user, admin-password), created by
  # make seal. Anonymous access stays off.
  admin:
    existingSecret: grafana-admin
  defaultDashboardsTimezone: browser
  # Grafana 13 keeps its search index in memory and was OOMKilled at 256Mi.
  resources:
    requests:
      cpu: 50m
      memory: 256Mi
    limits:
      memory: 512Mi
  # TODO(owner): once DNS points the host at the VM, enable it and set the host
  # in all three places:
  #   ingress.enabled: true, ingress.hosts: [grafana.example.com],
  #   ingress.tls[0].hosts: [grafana.example.com],
  #   grafana.ini.server.root_url: https://grafana.example.com
  # Switch the issuer to letsencrypt-prod once the staging certificate is issued.
  ingress:
    enabled: false
    ingressClassName: traefik
    annotations:
      cert-manager.io/cluster-issuer: letsencrypt-staging
    hosts: []
    tls:
      - secretName: grafana-tls
        hosts: []
