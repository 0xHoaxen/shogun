version: v2
managed:
  enabled: true
  override:
    - file_option: go_package_prefix
      value: github.com/0xHoaxen/shogun/gen/go
plugins:
  - local: bin/protoc-gen-go
    out: gen/go
    opt: paths=source_relative
  - local: bin/protoc-gen-go-grpc
    out: gen/go
    opt: paths=source_relative
  # TypeScript client is added in P7:
  # - local: web/node_modules/.bin/protoc-gen-connect-es
  #   out: web/src/gen
  #   opt: target=ts
