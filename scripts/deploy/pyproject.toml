[project]
name = "shogun-deploy"
version = "0.1.0"
description = "Installs Shogun on a cluster: helmfile phases, sealed Secrets, backups."
requires-python = ">=3.12"
# typer: commands and flags; rich: step logs, spinners, tables, prompts;
# pyyaml: reading image tags from deploy/apps values.
dependencies = [
  "typer>=0.16,<1",
  "rich>=14,<15",
  "pyyaml>=6,<7",
]

[project.scripts]
shogun-deploy = "shogun_deploy.cli:main"

[dependency-groups]
dev = [
  "pytest>=8,<9",
  "ruff>=0.12,<1",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["needs_helm: renders charts with the real helm and helmfile"]
