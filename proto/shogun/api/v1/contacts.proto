syntax = "proto3";

package shogun.api.v1;

import "google/protobuf/timestamp.proto";
import "shogun/api/v1/jobs.proto";

// ContactsService is the screen-shaped contact API of the web app. Torii maps
// it onto kagami. Mutating calls honour the Idempotency-Key request header.
service ContactsService {
  // ListContacts returns contacts for the table, optionally filtered by status.
  rpc ListContacts(ListContactsRequest) returns (ListContactsResponse);
  // AddContact creates a contact, creating the company when it is new.
  rpc AddContact(AddContactRequest) returns (AddContactResponse);
  // ChangeContactStatus moves a contact along the state machine; an invalid
  // move is FailedPrecondition with reason CONTACT_STATUS_INVALID_TRANSITION.
  rpc ChangeContactStatus(ChangeContactStatusRequest) returns (ChangeContactStatusResponse);
  // GetContact returns one contact with its notes and history, newest first, and
  // the owner's jobs at its company (at most 20).
  rpc GetContact(GetContactRequest) returns (GetContactResponse);
  // AddContactNote adds a note. Empty text is INVALID_NOTE and text over 2000
  // characters NOTE_TOO_LONG. It never conflicts with an edit.
  rpc AddContactNote(AddContactNoteRequest) returns (AddContactNoteResponse);
  // MarkContacted records that the owner reached the contact themselves. A
  // contact not yet reached moves to reached out; otherwise only last_contacted
  // changes. A future date is INVALID_DATE and a stale version VERSION_CONFLICT.
  rpc MarkContacted(MarkContactedRequest) returns (MarkContactedResponse);
  // ImportContacts parses a contacts CSV. With dry_run nothing is written and
  // the report is the preview shown before the owner confirms. With reshape a
  // sheet with other columns is first mapped onto the import columns by the
  // owner's AI provider: no column holding a name is FailedPrecondition with
  // reason IMPORT_NO_NAME_COLUMN, a provider that fails or answers badly
  // IMPORT_RESHAPE_FAILED, no provider AI_PROVIDER_NOT_CONFIGURED, and a spent
  // budget ResourceExhausted with reason BUDGET_EXHAUSTED.
  rpc ImportContacts(ImportContactsRequest) returns (ImportContactsResponse);
}

enum ContactStatus {
  CONTACT_STATUS_UNSPECIFIED = 0;
  CONTACT_STATUS_NOT_REACHED = 1;
  CONTACT_STATUS_REACHED_OUT = 2;
  CONTACT_STATUS_CONVERSATION_STARTED = 3;
  CONTACT_STATUS_REPLIED = 4;
  CONTACT_STATUS_REFERRAL_ASKED = 5;
}

// Contact is one row of the contact table.
message Contact {
  string id = 1;
  string full_name = 2;
  string role = 3;
  string company_name = 4;
  ContactStatus status = 5;
  string email = 6;
  string linkedin_url = 7;
  string preferred_channel = 8;
  string last_contacted = 9;
  string next_follow_up = 10;
  string notes = 11;
  int32 version = 12;
  // relationship is one of recruiter, engineer, manager, alumni, friend, other,
  // or empty.
  string relationship = 13;
  string how_we_met = 14;
}

message ListContactsRequest {
  // status filters to one status; unspecified means all.
  ContactStatus status = 1;
  // query matches name, email and company text.
  string query = 2;
  int32 page_size = 3;
  string page_token = 4;
}

message ListContactsResponse {
  repeated Contact contacts = 1;
  string next_page_token = 2;
}

message AddContactRequest {
  string full_name = 1;
  string role = 2;
  string company_name = 3;
  string email = 4;
  string linkedin_url = 5;
  string preferred_channel = 6;
  string notes = 7;
  // relationship must be one of the six values or empty (INVALID_RELATIONSHIP).
  string relationship = 8;
  string how_we_met = 9;
}

message AddContactResponse {
  Contact contact = 1;
}

message ChangeContactStatusRequest {
  string id = 1;
  ContactStatus to_status = 2;
  int32 version = 3;
}

message ChangeContactStatusResponse {
  Contact contact = 1;
}

message GetContactRequest {
  string id = 1;
}

// ContactEvent is one line of a contact's history.
message ContactEvent {
  string id = 1;
  // kind is created, status_changed, message_sent, reply_received or note.
  string kind = 2;
  string channel = 3;
  // text is the note's text for a note, and empty for other kinds.
  string text = 4;
  google.protobuf.Timestamp occurred_at = 5;
}

message GetContactResponse {
  Contact contact = 1;
  repeated ContactEvent history = 2;
  repeated JobCard linked_jobs = 3;
}

message AddContactNoteRequest {
  string id = 1;
  string text = 2;
}

message AddContactNoteResponse {
  ContactEvent note = 1;
}

message MarkContactedRequest {
  string id = 1;
  int32 version = 2;
  // on is YYYY-MM-DD; empty means today in the owner's time zone.
  string on = 3;
}

message MarkContactedResponse {
  Contact contact = 1;
}

message ImportContactsRequest {
  string filename = 1;
  bytes csv = 2;
  bool dry_run = 3;
  // reshape asks the owner's AI provider to map a sheet with other columns
  // onto the import columns first. A sheet that already has them is not sent.
  bool reshape = 4;
  // mappings is the caller's own column mapping; when set it is used instead of
  // the AI's and no model is called (INVALID_MAPPING when it does not fit the
  // sheet). date_order is dmy, mdy or ymd, or empty.
  repeated ColumnMapping mappings = 5;
  string date_order = 6;
  // selection limits the import to some rows; unset imports all. A duplicate is
  // imported only if it is listed. Row numbers are those of the preview, so
  // preview again after changing the mapping (INVALID_ROW_SELECTION otherwise).
  RowSelection selection = 7;
}

message RowSelection {
  repeated int32 rows = 1;
}

// ImportPreviewRow is one row of a dry run.
message ImportPreviewRow {
  // row is the 1-based CSV row number, counting the header as row 1.
  int32 row = 1;
  string full_name = 2;
  string role = 3;
  string company = 4;
  string email = 5;
  // relationship is the file's, or a guess from the role when it has none.
  string relationship = 6;
  bool relationship_guessed = 7;
  // duplicate is true when the person is already in the book (by email,
  // LinkedIn, or the same name at the same company).
  bool duplicate = 8;
  string duplicate_contact_id = 9;
  // duplicate_reason is email, linkedin or name_company.
  string duplicate_reason = 10;
  // repeats_row is the earlier row of this file that is the same person, or 0.
  int32 repeats_row = 11;
  // problem says why the row cannot be imported; empty when it can.
  string problem = 12;
}

message ImportRowError {
  // row is the 1-based CSV row number, counting the header as row 1.
  int32 row = 1;
  string column = 2;
  string message = 3;
}

message ImportReport {
  int32 rows_total = 1;
  int32 rows_created = 2;
  int32 rows_updated = 3;
  int32 rows_failed = 4;
  repeated ImportRowError errors = 5;
  // rows_skipped counts rows a selection left out.
  int32 rows_skipped = 6;
}

message ImportContactsResponse {
  ImportReport report = 1;
  // import_id is empty on a dry run.
  string import_id = 2;
  // shaped_csv is the sheet in the import columns, set when reshape changed
  // it. Import it with reshape off to apply exactly what was previewed.
  bytes shaped_csv = 3;
  // mappings say which columns of the sheet fill each import column.
  repeated ColumnMapping mappings = 4;
  // date_order is how numeric dates were read; send it back with mappings.
  string date_order = 5;
  // rows previews the first 1000 rows of a dry run; rows_truncated says there
  // were more. The report counts every row.
  repeated ImportPreviewRow rows = 6;
  bool rows_truncated = 7;
}

// ColumnMapping fills one import column from columns of the sheet.
message ColumnMapping {
  string target = 1;
  repeated string sources = 2;
}
