syntax = "proto3";

package shogun.api.v1;

import "google/protobuf/timestamp.proto";

// DraftsService is the screen-shaped API for the approval queue. Torii maps it
// onto fude. Nothing leaves the system until the owner approves an exact
// version here.
service DraftsService {
  // ListQueue returns one page of drafts in a state, newest first; the default
  // state is pending.
  rpc ListQueue(ListQueueRequest) returns (ListQueueResponse);
  // GetDraft returns a draft with every version, newest first.
  rpc GetDraft(GetDraftRequest) returns (GetDraftResponse);
  // GenerateDraft queues a new draft. A retry with the same Idempotency-Key
  // header returns the original.
  rpc GenerateDraft(GenerateDraftRequest) returns (GenerateDraftResponse);
  // Regenerate queues a new AI version of a pending draft.
  rpc Regenerate(RegenerateRequest) returns (RegenerateResponse);
  // EditDraft stores the owner's own text as a new version. Editing an
  // approved draft puts it back to pending.
  rpc EditDraft(EditDraftRequest) returns (EditDraftResponse);
  // Approve approves one exact version. For email it is then sent; for the
  // copy-only channels the response says to copy it. A stale version is Aborted
  // with reason VERSION_CONFLICT.
  rpc Approve(ApproveRequest) returns (ApproveResponse);
  rpc Discard(DiscardRequest) returns (DiscardResponse);
}

enum DraftKind {
  DRAFT_KIND_UNSPECIFIED = 0;
  DRAFT_KIND_COVER_LETTER = 1;
  DRAFT_KIND_OUTREACH = 2;
  DRAFT_KIND_FOLLOW_UP = 3;
  DRAFT_KIND_POST = 4;
  DRAFT_KIND_ONE_OFF = 5;
}

enum DraftChannel {
  DRAFT_CHANNEL_UNSPECIFIED = 0;
  DRAFT_CHANNEL_EMAIL = 1;
  DRAFT_CHANNEL_LINKEDIN = 2;
  DRAFT_CHANNEL_X = 3;
  DRAFT_CHANNEL_OTHER = 4;
}

enum DraftState {
  DRAFT_STATE_UNSPECIFIED = 0;
  DRAFT_STATE_GENERATING = 1;
  DRAFT_STATE_PENDING = 2;
  DRAFT_STATE_APPROVED = 3;
  DRAFT_STATE_SENT = 4;
  DRAFT_STATE_DISCARDED = 5;
  DRAFT_STATE_FAILED = 6;
}

enum DraftTarget {
  DRAFT_TARGET_UNSPECIFIED = 0;
  DRAFT_TARGET_NONE = 1;
  DRAFT_TARGET_JOB = 2;
  DRAFT_TARGET_CONTACT = 3;
}

enum VersionAuthor {
  VERSION_AUTHOR_UNSPECIFIED = 0;
  VERSION_AUTHOR_AI = 1;
  VERSION_AUTHOR_USER = 2;
}

message Draft {
  string id = 1;
  DraftKind kind = 2;
  DraftTarget target = 3;
  string target_id = 4;
  DraftChannel channel = 5;
  DraftState state = 6;
  // current_version is the newest version, 0 while the first is written.
  int32 current_version = 7;
  string recipient = 8;
  string failure_reason = 9;
  // version is the optimistic lock a change must send back.
  int32 version = 10;
  // subject and preview are those of the newest version.
  string subject = 11;
  string preview = 12;
  google.protobuf.Timestamp created_at = 13;
  google.protobuf.Timestamp updated_at = 14;
}

message DraftVersion {
  int32 version = 1;
  string subject = 2;
  string body = 3;
  VersionAuthor author = 4;
  // extra_context is what the owner typed when asking for this version.
  string extra_context = 5;
  google.protobuf.Timestamp created_at = 6;
}

message ListQueueRequest {
  DraftState state = 1;
  int32 page_size = 2;
  string page_token = 3;
}

message ListQueueResponse {
  repeated Draft drafts = 1;
  string next_page_token = 2;
}

message GetDraftRequest {
  string id = 1;
}

message GetDraftResponse {
  Draft draft = 1;
  repeated DraftVersion versions = 2;
}

message GenerateDraftRequest {
  DraftKind kind = 1;
  DraftTarget target = 2;
  string target_id = 3;
  DraftChannel channel = 4;
  // recipient is the email address when the channel is email.
  string recipient = 5;
  // extra_context is what the draft should say or keep in mind.
  string extra_context = 6;
}

message GenerateDraftResponse {
  Draft draft = 1;
}

message RegenerateRequest {
  string id = 1;
  string extra_context = 2;
  int32 version = 3;
}

message RegenerateResponse {
  Draft draft = 1;
}

message EditDraftRequest {
  string id = 1;
  string subject = 2;
  string body = 3;
  int32 version = 4;
}

message EditDraftResponse {
  Draft draft = 1;
  DraftVersion draft_version = 2;
}

message ApproveRequest {
  string id = 1;
  // version is the draft version the owner saw and approves.
  int32 version = 2;
  // body_sha256 is the digest of the subject and body the owner saw, so a text
  // that changed since is refused.
  bytes body_sha256 = 3;
}

message ApproveResponse {
  Draft draft = 1;
  // copy_ready is true when the owner copies the text by hand (LinkedIn, X);
  // otherwise it is being sent.
  bool copy_ready = 2;
}

message DiscardRequest {
  string id = 1;
  int32 version = 2;
}

message DiscardResponse {
  Draft draft = 1;
}
