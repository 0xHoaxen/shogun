syntax = "proto3";

package shogun.fude.v1;

import "shogun/fude/v1/fude.proto";

// Payloads of the events fude produces. Routes live in pkg/bus/routes.go.

// DraftReady is the payload of draft.ready.
message DraftReady {
  string draft_id = 1;
  DraftKind kind = 2;
  TargetType target_type = 3;
  string target_id = 4;
  int32 version = 5;
  string owner_id = 6;
}

// DraftFailed is the payload of draft.failed.
message DraftFailed {
  string draft_id = 1;
  string reason = 2;
  string owner_id = 3;
}

// DraftApproved is the payload of draft.approved.
message DraftApproved {
  string draft_id = 1;
  int32 version = 2;
  Channel channel = 3;
  string owner_id = 4;
}
