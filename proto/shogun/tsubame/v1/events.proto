syntax = "proto3";

package shogun.tsubame.v1;

// Payloads of the events tsubame produces. Routes live in pkg/bus/routes.go.

// MailClass is what a message was classified as.
enum MailClass {
  MAIL_CLASS_UNSPECIFIED = 0;
  MAIL_CLASS_APPLICATION_CONFIRMATION = 1;
  MAIL_CLASS_INTERVIEW_INVITE = 2;
  MAIL_CLASS_REJECTION = 3;
  MAIL_CLASS_OFFER = 4;
  MAIL_CLASS_RECRUITER_OUTREACH = 5;
  MAIL_CLASS_REPLY = 6;
  MAIL_CLASS_OTHER = 7;
}

// MailClassified is the payload of mail.classified.
message MailClassified {
  // owner_id lets consumers act for the owner without a caller identity.
  string owner_id = 1;
  string message_id = 2;
  MailClass classification = 3;
  // confidence is between 0 and 1.
  float confidence = 4;
  // job_id and contact_id are the kagami ids the mail was linked to, empty
  // when it was not.
  string job_id = 5;
  string contact_id = 6;
  // classified_by is rule or llm.
  string classified_by = 7;
}

// MailReplyDetected is the payload of mail.reply_detected: a contact wrote back.
message MailReplyDetected {
  string owner_id = 1;
  string message_id = 2;
  string contact_id = 3;
}
