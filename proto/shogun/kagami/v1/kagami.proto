syntax = "proto3";

package shogun.kagami.v1;

import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

// KagamiService holds jobs, companies, contacts, their timelines and
// follow-ups. Dates without a time are YYYY-MM-DD strings.
service KagamiService {
  // AddJob creates a job, upserting its company by domain. Callers: torii, shinobi.
  rpc AddJob(AddJobRequest) returns (AddJobResponse);
  rpc GetJob(GetJobRequest) returns (GetJobResponse);
  rpc ListJobs(ListJobsRequest) returns (ListJobsResponse);
  // UpdateJob applies update_mask to the job if version matches.
  rpc UpdateJob(UpdateJobRequest) returns (UpdateJobResponse);
  // ChangeJobStatus moves a job along the job state machine; an invalid move
  // is FailedPrecondition with reason JOB_STATUS_INVALID_TRANSITION.
  rpc ChangeJobStatus(ChangeJobStatusRequest) returns (ChangeJobStatusResponse);

  rpc AddContact(AddContactRequest) returns (AddContactResponse);
  rpc UpdateContact(UpdateContactRequest) returns (UpdateContactResponse);
  rpc ListContacts(ListContactsRequest) returns (ListContactsResponse);
  // GetContact returns the contact with its timeline.
  rpc GetContact(GetContactRequest) returns (GetContactResponse);
  // AddContactNote adds a note to the contact's timeline and returns it. The text
  // is trimmed; empty is INVALID_NOTE and more than 2000 characters NOTE_TOO_LONG.
  // A note does not change the contact, so it never conflicts with an edit.
  rpc AddContactNote(AddContactNoteRequest) returns (AddContactNoteResponse);
  // MarkContacted records that the owner reached the contact themselves, outside
  // Shogun. A contact not yet reached moves to reached_out; for any other status
  // only last_contacted changes, and a status never moves backwards. A stale
  // version is VERSION_CONFLICT and a future date INVALID_DATE.
  rpc MarkContacted(MarkContactedRequest) returns (MarkContactedResponse);
  // ChangeContactStatus fails with CONTACT_STATUS_INVALID_TRANSITION on an
  // invalid move.
  rpc ChangeContactStatus(ChangeContactStatusRequest) returns (ChangeContactStatusResponse);
  // ImportContacts parses a contacts CSV. With dry_run nothing is written.
  rpc ImportContacts(ImportContactsRequest) returns (ImportContactsResponse);

  // ListDueFollowUps returns jobs and contacts whose next_follow_up is on or
  // before a date. Callers: torii, taiko.
  rpc ListDueFollowUps(ListDueFollowUpsRequest) returns (ListDueFollowUpsResponse);

  // FindMailLinks says which contact and job a piece of mail is about. Callers:
  // tsubame.
  rpc FindMailLinks(FindMailLinksRequest) returns (FindMailLinksResponse);
}

enum JobStatus {
  JOB_STATUS_UNSPECIFIED = 0;
  JOB_STATUS_SAVED = 1;
  JOB_STATUS_APPLIED = 2;
  JOB_STATUS_SHORTLISTED = 3;
  JOB_STATUS_INTERVIEW = 4;
  JOB_STATUS_OFFER = 5;
  JOB_STATUS_REJECTED = 6;
}

enum ContactStatus {
  CONTACT_STATUS_UNSPECIFIED = 0;
  CONTACT_STATUS_NOT_REACHED = 1;
  CONTACT_STATUS_REACHED_OUT = 2;
  CONTACT_STATUS_CONVERSATION_STARTED = 3;
  CONTACT_STATUS_REPLIED = 4;
  CONTACT_STATUS_REFERRAL_ASKED = 5;
}

message Company {
  string id = 1;
  string name = 2;
  string domain = 3;
  string notes = 4;
  int32 version = 5;
  google.protobuf.Timestamp created_at = 6;
  google.protobuf.Timestamp updated_at = 7;
}

message Job {
  string id = 1;
  string company_id = 2;
  string title = 3;
  string url = 4;
  string source = 5;
  JobStatus status = 6;
  string applied_on = 7;
  string next_follow_up = 8;
  string salary_text = 9;
  string location = 10;
  string description = 11;
  int32 version = 12;
  google.protobuf.Timestamp created_at = 13;
  google.protobuf.Timestamp updated_at = 14;
  google.protobuf.Timestamp archived_at = 15;
  // company_name is the name of company_id, filled in on responses.
  string company_name = 16;
}

message JobEvent {
  string id = 1;
  string job_id = 2;
  // kind is one of status_changed, note, mail_linked, follow_up_set.
  string kind = 3;
  JobStatus from_status = 4;
  JobStatus to_status = 5;
  // payload is a JSON object.
  string payload = 6;
  google.protobuf.Timestamp occurred_at = 7;
}

message Contact {
  string id = 1;
  string full_name = 2;
  string company_id = 3;
  string role = 4;
  string email = 5;
  string linkedin_url = 6;
  string x_handle = 7;
  string phone = 8;
  string relationship = 9;
  string how_we_met = 10;
  ContactStatus status = 11;
  string preferred_channel = 12;
  string last_contacted = 13;
  string next_follow_up = 14;
  string target_role = 15;
  string job_id = 16;
  repeated string tags = 17;
  string notes = 18;
  int32 version = 19;
  google.protobuf.Timestamp created_at = 20;
  google.protobuf.Timestamp updated_at = 21;
  google.protobuf.Timestamp archived_at = 22;
  // company_name is the name of company_id, filled in on responses.
  string company_name = 23;
}

message ContactEvent {
  string id = 1;
  string contact_id = 2;
  // kind is one of status_changed, message_sent, reply_received, note.
  string kind = 3;
  string channel = 4;
  // payload is a JSON object.
  string payload = 5;
  google.protobuf.Timestamp occurred_at = 6;
}

message AddJobRequest {
  string title = 1;
  string company_name = 2;
  // company_domain is the upsert key for the company; optional.
  string company_domain = 3;
  string url = 4;
  string source = 5;
  // status defaults to saved when unspecified.
  JobStatus status = 6;
  string location = 7;
  string salary_text = 8;
  string description = 9;
  // idempotency_key makes a retried call return the original job.
  string idempotency_key = 10;
}

message AddJobResponse {
  Job job = 1;
  Company company = 2;
}

message GetJobRequest {
  string id = 1;
}

message GetJobResponse {
  Job job = 1;
  Company company = 2;
  repeated JobEvent events = 3;
}

message ListJobsRequest {
  // status filters when set; unspecified means all.
  JobStatus status = 1;
  string company_id = 2;
  // due_before is a YYYY-MM-DD date; jobs with next_follow_up on or before it.
  string due_before = 3;
  int32 page_size = 4;
  string page_token = 5;
}

message ListJobsResponse {
  repeated Job jobs = 1;
  string next_page_token = 2;
}

message UpdateJobRequest {
  Job job = 1;
  google.protobuf.FieldMask update_mask = 2;
  // version is the version the caller last read.
  int32 version = 3;
}

message UpdateJobResponse {
  Job job = 1;
}

message ChangeJobStatusRequest {
  string id = 1;
  JobStatus to_status = 2;
  string note = 3;
  int32 version = 4;
}

message ChangeJobStatusResponse {
  Job job = 1;
}

message AddContactRequest {
  Contact contact = 1;
  // company_name creates or finds the company by name when company_id is empty.
  string company_name = 2;
  string idempotency_key = 3;
}

message AddContactResponse {
  Contact contact = 1;
}

message UpdateContactRequest {
  Contact contact = 1;
  google.protobuf.FieldMask update_mask = 2;
  int32 version = 3;
}

message UpdateContactResponse {
  Contact contact = 1;
}

message ListContactsRequest {
  ContactStatus status = 1;
  string tag = 2;
  string company_id = 3;
  // query matches name, email and company text.
  string query = 4;
  int32 page_size = 5;
  string page_token = 6;
}

message ListContactsResponse {
  repeated Contact contacts = 1;
  string next_page_token = 2;
}

message GetContactRequest {
  string id = 1;
}

message GetContactResponse {
  Contact contact = 1;
  repeated ContactEvent timeline = 2;
  // linked_jobs are the owner's jobs at the contact's company, newest first, at
  // most 20. Empty when the contact has no company.
  repeated Job linked_jobs = 3;
}

message AddContactNoteRequest {
  string id = 1;
  string text = 2;
}

message AddContactNoteResponse {
  ContactEvent note = 1;
}

message MarkContactedRequest {
  string id = 1;
  int32 version = 2;
  // on is YYYY-MM-DD; empty means today in the owner's time zone.
  string on = 3;
}

message MarkContactedResponse {
  Contact contact = 1;
}

message ChangeContactStatusRequest {
  string id = 1;
  ContactStatus to_status = 2;
  int32 version = 3;
}

message ChangeContactStatusResponse {
  Contact contact = 1;
}

message ImportContactsRequest {
  string filename = 1;
  bytes csv = 2;
  bool dry_run = 3;
  // reshape asks the caller's AI provider to map a sheet with other columns
  // onto the import columns first. A sheet that already has them is not sent.
  bool reshape = 4;
  // mappings is the caller's own column mapping of the sheet. When set it is used
  // instead of the AI's and no model is called, whatever reshape says. It is
  // checked as the AI's is: every target an import column used once, every source
  // a column of the sheet used once, full_name filled. A bad one is
  // INVALID_MAPPING, or IMPORT_NO_NAME_COLUMN when no column holds a name.
  repeated ColumnMapping mappings = 5;
  // date_order is how the sheet writes dates made only of numbers (dmy, mdy or
  // ymd) when mappings is set; empty reads only unambiguous dates. Anything else
  // is INVALID_MAPPING. The response returns the order the AI found, to send back.
  string date_order = 6;
  // selection limits the import to some rows. Unset imports every row. A row that
  // matches a contact already known is imported (that contact is updated) only
  // if it is listed.
  RowSelection selection = 7;
}

// RowSelection lists the rows of a file to import. Numbers are the 1-based CSV
// rows of the file that is applied, counting the header as row 1: the numbers the
// dry-run preview gives. They only mean something for the same file and mapping,
// so preview again after changing either. A number that is not a row of the file
// is INVALID_ROW_SELECTION and nothing is applied. An empty list imports nothing.
message RowSelection {
  repeated int32 rows = 1;
}

message ImportRowError {
  // row is the 1-based CSV row number, counting the header as row 1.
  int32 row = 1;
  string column = 2;
  string message = 3;
}

message ImportReport {
  int32 rows_total = 1;
  int32 rows_created = 2;
  int32 rows_updated = 3;
  int32 rows_failed = 4;
  repeated ImportRowError errors = 5;
  // rows_skipped counts the rows of the file that a selection left out. With a
  // selection, rows_total counts only the rows processed.
  int32 rows_skipped = 6;
}

message ImportContactsResponse {
  ImportReport report = 1;
  // import_id is empty on a dry run.
  string import_id = 2;
  // shaped_csv is the sheet in the import columns, set when reshape changed
  // it. Import it with reshape off to apply exactly what was previewed.
  bytes shaped_csv = 3;
  // mappings say which columns of the sheet fill each import column.
  repeated ColumnMapping mappings = 4;
  // rows says, for each row of the file, what the import read and whether the
  // person is already known. Set on a dry run only.
  repeated ImportPreviewRow rows = 5;
  // rows_truncated is true when the file had more than 1000 rows, so rows holds
  // only the first 1000. The report still counts them all, and an import applies
  // them all. (A reshaped sheet travels in this response too, and the two have to
  // fit gRPC's 4 MiB.)
  bool rows_truncated = 6;
  // date_order is the order the sheet's numeric dates were read in (dmy, mdy or
  // ymd, or empty), set when the sheet was reshaped or mapped.
  string date_order = 7;
}

// ImportPreviewRow is one row of a dry run.
message ImportPreviewRow {
  // row is the 1-based CSV row number, counting the header as row 1.
  int32 row = 1;
  string full_name = 2;
  string role = 3;
  string company = 4;
  string email = 5;
  // relationship is the one in the file, or a guess from the role (rules on the
  // words of the title, no AI call) when the file has none.
  string relationship = 6;
  bool relationship_guessed = 7;
  // duplicate is true when the person is already in the book, found by email,
  // then LinkedIn URL, then the same name at the same company. The import would
  // update that contact rather than add one.
  bool duplicate = 8;
  string duplicate_contact_id = 9;
  // duplicate_reason is email, linkedin or name_company.
  string duplicate_reason = 10;
  // repeats_row is the earlier row of this file that is the same person, or 0.
  int32 repeats_row = 11;
  // problem says why the row cannot be imported; empty when it can.
  string problem = 12;
}

// ColumnMapping fills one import column from columns of the sheet.
message ColumnMapping {
  string target = 1;
  repeated string sources = 2;
}

message ListDueFollowUpsRequest {
  // on_or_before is a YYYY-MM-DD date.
  string on_or_before = 1;
}

message ListDueFollowUpsResponse {
  repeated Job jobs = 1;
  repeated Contact contacts = 2;
}

message FindMailLinksRequest {
  // from_email is the sender's address.
  string from_email = 1;
  // urls are links found in the mail, to match against job posting URLs.
  repeated string urls = 2;
}

message FindMailLinksResponse {
  // contact_id is the contact with that email address, empty when none.
  string contact_id = 1;
  // job_id is the job the mail is most likely about, empty when none: a job
  // whose posting URL is in the mail, else an open job at the sender's company
  // (matched by the sender's domain), else the contact's own job.
  string job_id = 2;
}
