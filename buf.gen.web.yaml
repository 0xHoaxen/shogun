version: v2
# TypeScript client for the browser API only: torii's public proto/shogun/api.
# Run through `make proto` (buf generate --template buf.gen.web.yaml --path proto/shogun/api).
# protoc-gen-es v2 emits the message types and service descriptors that
# @connectrpc/connect-web consumes; no separate connect plugin is needed.
clean: true
plugins:
  - local: web/node_modules/.bin/protoc-gen-es
    out: web/src/gen
    opt:
      - target=ts
