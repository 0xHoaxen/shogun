version: "2"

run:
  go: "1.26.9"

linters:
  default: standard
  enable:
    - bodyclose
    - depguard
    - errorlint
    - gocritic
    - misspell
    - revive
    - sloglint
  settings:
    depguard:
      rules:
        pkg-no-services:
          list-mode: lax
          files:
            - "**/pkg/**"
          deny:
            - pkg: "github.com/0xHoaxen/shogun/services"
              desc: pkg must not import services
        anthropic-only-in-llm:
          list-mode: lax
          files:
            - "$all"
            - "!**/pkg/llm/**"
          deny:
            - pkg: "github.com/anthropics/anthropic-sdk-go"
              desc: all Claude calls go through pkg/llm
        svc-torii:
          list-mode: lax
          files:
            - "**/services/torii/**"
          deny:
            - pkg: "github.com/0xHoaxen/shogun/services/kagami"
              desc: services must not import other services; use gRPC
            - pkg: "github.com/0xHoaxen/shogun/services/tsubame"
              desc: services must not import other services; use gRPC
            - pkg: "github.com/0xHoaxen/shogun/services/fude"
              desc: services must not import other services; use gRPC
            - pkg: "github.com/0xHoaxen/shogun/services/taiko"
