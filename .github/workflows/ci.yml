name: ci

on:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GOTOOLCHAIN: local

jobs:
  modules:
    name: modules
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.list.outputs.matrix }}
      golangci-lint: ${{ steps.versions.outputs.golangci-lint }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: .tool-versions
          cache: false
      - id: list
        name: List workspace modules
        run: |
          dirs=$(go list -m -f '{{.Dir}}' | sed "s|^$PWD|.|; s|^\./||" | jq -R . | jq -sc '{dir: .}')
          echo "matrix=$dirs" >> "$GITHUB_OUTPUT"
      - id: versions
        name: Read pinned tool versions
        run: echo "golangci-lint=v$(awk '$1=="golangci-lint"{print $2}' .tool-versions)" >> "$GITHUB_OUTPUT"

  lint:
    name: lint (${{ matrix.dir }})
    needs: modules
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.modules.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: .tool-versions
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: ${{ needs.modules.outputs.golangci-lint }}
          working-directory: ${{ matrix.dir }}

  lint-config:
    name: lint config
    needs: modules
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: .tool-versions
          cache: false
      - name: golangci-lint config verify
        env:
          GOWORK: "off"
        run: go run github.com/golangci/golangci-lint/v2/cmd/golangci-lint@${{ needs.modules.outputs.golangci-lint }} config verify

  test:
    name: test (${{ matrix.dir }})
    needs: modules
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.modules.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: .tool-versions
      - name: go test -race
        working-directory: ${{ matrix.dir }}
        run: go test -race -count=1 ./...

  isolated-build:
    name: build (${{ matrix.dir }}, GOWORK=off)
    needs: modules
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.modules.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: .tool-versions
      - name: Build outside the workspace
        working-directory: ${{ matrix.dir }}
        env:
          GOWORK: "off"
        run: go build ./...

  build:
    name: build binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: .tool-versions
      - run: make build

  ci-ok:
    name: ci ok
    if: always()
    needs: [lint, lint-config, test, isolated-build, build]
    runs-on: ubuntu-latest
    steps:
      - name: Fail if any required job failed or was cancelled
        run: |
          echo '${{ toJSON(needs) }}' | jq -e 'all(.[]; .result == "success")' > /dev/null
