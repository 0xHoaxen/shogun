name: ci

on:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GOTOOLCHAIN: local

jobs:
  modules:
    name: modules
    runs-on: ubuntu-latest
    outputs:
      skip: ${{ steps.list.outputs.skip }}
      matrix: ${{ steps.list.outputs.matrix }}
      any: ${{ steps.list.outputs.any }}
      services: ${{ steps.list.outputs.services }}
      any-service: ${{ steps.list.outputs.any-service }}
      golangci-lint: ${{ steps.versions.outputs.golangci-lint }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: .tool-versions
          cache: false
      - id: list
        name: Select affected modules
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          zeros=0000000000000000000000000000000000000000
          skip=false
          if [ -z "$BEFORE" ] || [ "$BEFORE" = "$zeros" ] || ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            # New branch or a base that no longer exists (force push): run everything.
            dirs=$(go list -m -f '{{.Dir}}' | sed "s|^$PWD/||" | jq -R . | jq -sc '{dir: .}')
          else
            # Skip when every pushed commit is a Conventional Commits "ci" type.
            if [ "$(scripts/ci-only-commits.sh "$BEFORE")" = true ]; then
              skip=true
              dirs='{"dir":[]}'
            else
              dirs=$(scripts/changed-modules.sh "$BEFORE")
            fi
          fi
          services=$(jq -c '{service: [.dir[] | select(startswith("services/")) | ltrimstr("services/")]}' <<<"$dirs")
          {
            echo "skip=$skip"
            echo "matrix=$dirs"
            echo "any=$(jq '.dir | length > 0' <<<"$dirs")"
            echo "services=$services"
            echo "any-service=$(jq '.service | length > 0' <<<"$services")"
          } >> "$GITHUB_OUTPUT"
      - id: versions
        name: Read pinned tool versions
        run: echo "golangci-lint=v$(awk '$1=="golangci-lint"{print $2}' .tool-versions)" >> "$GITHUB_OUTPUT"

  lint:
    name: lint (${{ matrix.dir }})
    needs: modules
    if: needs.modules.outputs.any == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.modules.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: .tool-versions
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: ${{ needs.modules.outputs.golangci-lint }}
          working-directory: ${{ matrix.dir }}

  lint-config:
    name: lint config
    needs: modules
    if: needs.modules.outputs.skip != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: .tool-versions
          cache: false
      - name: golangci-lint config verify
        env:
          GOWORK: "off"
        run: go run github.com/golangci/golangci-lint/v2/cmd/golangci-lint@${{ needs.modules.outputs.golangci-lint }} config verify

  test:
    name: test (${{ matrix.dir }})
    needs: modules
    if: needs.modules.outputs.any == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.modules.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: .tool-versions
      - name: go test -race
        working-directory: ${{ matrix.dir }}
        run: go test -race -count=1 ./...

  isolated-build:
    name: build (${{ matrix.dir }}, GOWORK=off)
    needs: modules
    if: needs.modules.outputs.any == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.modules.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: .tool-versions
      - name: Build outside the workspace
        working-directory: ${{ matrix.dir }}
        env:
          GOWORK: "off"
        run: go build ./...

  build:
    name: build binaries (${{ matrix.service }})
    needs: modules
    if: needs.modules.outputs.any-service == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.modules.outputs.services) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: .tool-versions
      - run: make build SERVICE=${{ matrix.service }}

  docker-build:
    name: docker build (${{ matrix.service }})
    needs: modules
    if: needs.modules.outputs.any-service == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.modules.outputs.services) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build the image without pushing
        run: docker build --build-arg SERVICE=${{ matrix.service }} -f deploy/docker/Dockerfile .

  web:
    name: web
    needs: modules
    if: needs.modules.outputs.skip != 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .tool-versions
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

  e2e-compose:
    name: e2e (compose)
    needs: modules
    if: needs.modules.outputs.skip != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      COMPOSE: docker compose --env-file .env.example -f deploy/compose/compose.yaml -f deploy/compose/compose.e2e.yaml
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .tool-versions
          cache: npm
          cache-dependency-path: web/package-lock.json
      # Only what the flow needs: other services are not called, and torii's
      # event relay to them just retries.
      - name: Start the stack with a stub identity provider
        run: $COMPOSE up -d --build --wait postgres kagami torii web mock-oauth2
      - name: Install web dependencies and the browser
        working-directory: web
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Log in, add a job, move it
        working-directory: web
        run: npm run test:e2e:compose
      - name: Show container logs
        if: failure()
        run: $COMPOSE logs --no-color --tail=200
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: playwright-compose-report
          path: |
            web/playwright-report
            web/test-results
          if-no-files-found: ignore
      - name: Stop the stack
        if: always()
        run: $COMPOSE down -v --remove-orphans

  ci-ok:
    name: ci ok
    if: always()
    needs: [modules, lint, lint-config, test, isolated-build, build, docker-build, web, e2e-compose]
    runs-on: ubuntu-latest
    steps:
      # Matrix jobs are skipped when nothing they cover changed, so a skipped
      # job passes; modules must succeed or everything would be skipped silently.
      - name: Fail if any required job failed or was cancelled
        run: |
          echo '${{ toJSON(needs) }}' | jq -e 'all(.[]; .result == "success" or .result == "skipped") and .modules.result == "success"' > /dev/null
