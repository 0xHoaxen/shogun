name: security

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: "41 3 * * 1"

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GOTOOLCHAIN: local
  # Pinned tool versions; Dependabot does not track these, bump them by hand.
  GOVULNCHECK_VERSION: v1.1.4
  GITLEAKS_VERSION: v8.30.1

jobs:
  modules:
    name: modules
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.list.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: .tool-versions
          cache: false
      - id: list
        name: List every Go module
        run: |
          dirs=$(go list -m -f '{{.Dir}}' | sed "s|^$PWD/||" | jq -R . | jq -sc '{dir: .}')
          echo "matrix=$dirs" >> "$GITHUB_OUTPUT"

  govulncheck:
    name: govulncheck (${{ matrix.dir }})
    needs: modules
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.modules.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: .tool-versions
      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@${{ env.GOVULNCHECK_VERSION }}
      # Fails on any reachable vulnerability except the few in
      # .govulncheck-allow.json, which only the test database helper reaches.
      - name: Scan the module's call graph for known vulnerabilities
        run: scripts/govulncheck.py ${{ matrix.dir }}

  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: .tool-versions
          cache: false
      # The action needs a licence for organisation repositories; the binary
      # does not.
      - name: Install gitleaks
        run: go install github.com/zricethezav/gitleaks/v8@${{ env.GITLEAKS_VERSION }}
      - name: Scan the whole history for secrets
        run: gitleaks detect --source . --redact --verbose

  npm-audit:
    name: npm audit (web, production)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .tool-versions
      - name: Audit what ships (dev tools are not in the image)
        working-directory: web
        run: npm audit --omit=dev --audit-level=high
