name: release

# release-please opens one release PR per module. Merging it tags the module
# (for example services/kagami/v0.4.0); released services are then built,
# pushed to ghcr.io with an SBOM and provenance, their Helm charts pushed to
# ghcr.io/0xhoaxen/charts, and deployed to staging. The web app (tag web/v0.4.0)
# goes the same way in its own jobs, because its build differs.

on:
  # push:
  #   branches: [main]
  workflow_dispatch:
    inputs:
      service:
        description: 'Service to release (optional)'
        required: false
        default: ''
      version:
        description: 'Version to release (optional)'
        required: false
        default: ''

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release-please:
    name: release-please
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      services: ${{ steps.released.outputs.services }}
      any-service: ${{ steps.released.outputs.any-service }}
      web-released: ${{ steps.rp.outputs['web--release_created'] }}
      web-version: ${{ steps.rp.outputs['web--version'] }}
    steps:
      - id: rp
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
      - id: released
        name: List released services
        env:
          RELEASE_OUTPUTS: ${{ toJSON(steps.rp.outputs) }}
        run: |
          services=$(jq -c '
            [to_entries[]
              | select(.key | test("^services/[^/]+--version$"))
              | {service: (.key | ltrimstr("services/") | rtrimstr("--version")), version: .value}]
            | {include: .}' <<<"$RELEASE_OUTPUTS")
          {
            echo "services=$services"
            echo "any-service=$(jq '.include | length > 0' <<<"$services")"
          } >> "$GITHUB_OUTPUT"

  publish:
    name: publish (${{ matrix.service }} ${{ matrix.version }})
    needs: release-please
    if: needs.release-please.outputs.any-service == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.release-please.outputs.services) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: services/${{ matrix.service }}/v${{ matrix.version }}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: deploy/docker/Dockerfile
          push: true
          sbom: true
          provenance: mode=max
          build-args: |
            SERVICE=${{ matrix.service }}
            VERSION=${{ matrix.version }}
            COMMIT=${{ github.sha }}
          tags: ghcr.io/0xhoaxen/shogun-${{ matrix.service }}:${{ matrix.version }}

  publish-charts:
    name: publish chart (${{ matrix.service }} ${{ matrix.version }})
    needs: [release-please, publish]
    if: needs.release-please.outputs.any-service == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.release-please.outputs.services) }}
    env:
      SERVICE: ${{ matrix.service }}
      VERSION: ${{ matrix.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: services/${{ matrix.service }}/v${{ matrix.version }}
      - name: Log in to ghcr.io
        env:
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          helm version --short
          helm registry login ghcr.io --username "$REGISTRY_USER" --password-stdin <<<"$REGISTRY_TOKEN"
      - name: Package and push the chart
        run: |
          helm package "deploy/helm/$SERVICE" --dependency-update \
            --version "$VERSION" --app-version "$VERSION" --destination "$RUNNER_TEMP/charts"
          helm push "$RUNNER_TEMP/charts/shogun-$SERVICE-$VERSION.tgz" oci://ghcr.io/0xhoaxen/charts

  deploy-staging:
    name: deploy staging (${{ matrix.service }} ${{ matrix.version }})
    needs: [release-please, publish]
    if: needs.release-please.outputs.any-service == 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.release-please.outputs.services) }}
    permissions:
      contents: write
      pull-requests: write
    uses: ./.github/workflows/deploy.yml
    with:
      environment: staging
      service: ${{ matrix.service }}
      version: ${{ matrix.version }}

  publish-web:
    name: publish web ${{ needs.release-please.outputs.web-version }}
    needs: release-please
    if: needs.release-please.outputs.web-released == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: web/v${{ needs.release-please.outputs.web-version }}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Next.js bakes its /api and /auth rewrites into the image, so torii's
      # in-cluster address is fixed here; the chart cannot change it.
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: web
          file: deploy/docker/web.Dockerfile
          push: true
          sbom: true
          provenance: mode=max
          build-args: |
            TORII_URL=http://shogun-torii:8081
          tags: ghcr.io/0xhoaxen/shogun-web:${{ needs.release-please.outputs.web-version }}

  publish-web-chart:
    name: publish web chart ${{ needs.release-please.outputs.web-version }}
    needs: [release-please, publish-web]
    if: needs.release-please.outputs.web-released == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      VERSION: ${{ needs.release-please.outputs.web-version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: web/v${{ needs.release-please.outputs.web-version }}
      - name: Log in to ghcr.io
        env:
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          helm version --short
          helm registry login ghcr.io --username "$REGISTRY_USER" --password-stdin <<<"$REGISTRY_TOKEN"
      - name: Package and push the chart
        run: |
          helm package deploy/helm/web \
            --version "$VERSION" --app-version "$VERSION" --destination "$RUNNER_TEMP/charts"
          helm push "$RUNNER_TEMP/charts/shogun-web-$VERSION.tgz" oci://ghcr.io/0xhoaxen/charts

  deploy-staging-web:
    name: deploy staging (web ${{ needs.release-please.outputs.web-version }})
    needs: [release-please, publish-web]
    if: needs.release-please.outputs.web-released == 'true'
    permissions:
      contents: write
      pull-requests: write
    uses: ./.github/workflows/deploy.yml
    with:
      environment: staging
      service: web
      version: ${{ needs.release-please.outputs.web-version }}
