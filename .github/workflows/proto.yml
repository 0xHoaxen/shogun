name: proto

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: proto-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GOTOOLCHAIN: local

jobs:
  proto:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: .tool-versions
          cache-dependency-path: tools/go.sum
      - run: make tools
      - name: buf lint and generate
        run: make proto
      - name: Generated code is committed
        run: |
          git add -N .
          git diff --exit-code -- gen web/src/gen || {
            echo "::error::generated code is stale; run 'make proto' and commit the result"
            exit 1
          }
      - name: buf breaking against main
        if: github.event_name == 'pull_request'
        run: bin/buf breaking --against ".git#branch=origin/${{ github.base_ref }},subdir=proto"
