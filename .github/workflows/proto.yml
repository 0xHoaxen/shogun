name: proto

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: proto-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GOTOOLCHAIN: local

jobs:
  proto:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: .tool-versions
          cache-dependency-path: tools/go.sum
      - run: make tools
      - name: buf lint and generate
        run: make proto
      - name: Generated code is committed
        run: |
          git add -N .
          git diff --exit-code -- gen web/src/gen || {
            echo "::error::generated code is stale; run 'make proto' and commit the result"
            exit 1
          }
      - name: buf breaking against main
        if: github.event_name == 'pull_request'
        run: bin/buf breaking --against ".git#branch=origin/${{ github.base_ref }},subdir=proto"
