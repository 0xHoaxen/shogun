version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "ci"
    groups:
      actions:
        patterns: ["*"]

  # TODO: add /services/* once P2.3 generates the service modules, and /web in P7.
  - package-ecosystem: gomod
    directories:
      - /pkg
      - /gen/go
      - /tools
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore"
    groups:
      go-minor-patch:
        update-types: [minor, patch]
