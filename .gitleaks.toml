# Extends gitleaks' default rules. The only exemptions are values that are safe
# in the open: the local-dev placeholders in .env.example, the throwaway keys of
# service tests, and the kubeseal ciphertext of the sealed Secrets. They are
# exempt from one rule only, so any other kind of secret in these files, and any
# key anywhere else, still fails the scan.
title = "shogun"

[extend]
useDefault = true

[[allowlists]]
description = "placeholder keys in .env.example and in tests"
targetRules = ["generic-api-key"]
paths = [
  '''^\.env\.example$''',
  '''(^|/)main_test\.go(\.tmpl)?$''',
]

[[allowlists]]
description = "kubeseal ciphertext in the sealed Secrets, decryptable only by the cluster"
targetRules = ["generic-api-key"]
# Both must match: a plaintext value in these files still fails the scan.
condition = "AND"
paths = ['''^deploy/infrastructure/sealed-secrets/secrets/[^/]+/[^/]+\.yaml$''']
regexes = ['''^Ag[A-Za-z0-9+/]{300,}={0,2}$''']

[[allowlists]]
description = "the proto package name, which looks like a key to the entropy check"
targetRules = ["generic-api-key"]
regexes = ['''^shogun\.api\.v1$''']

[[allowlists]]
description = "the localStorage name of the appearance settings, which looks like a key to the entropy check"
targetRules = ["generic-api-key"]
# Both must match: only this exact name in this file passes.
condition = "AND"
paths = ['''^web/src/lib/appearance\.ts$''']
regexes = ['''^shogun\.appearance\.v1$''']

[[allowlists]]
description = "truncated kubeseal ciphertext shown as an example in the deploy guide"
targetRules = ["generic-api-key"]
# Both must match: only a value cut short with "..." passes, a full key still fails.
condition = "AND"
paths = ['''^deploy-guide\.md$''']
regexes = ['''^Ag[A-Za-z0-9+/]+\.\.\.$''']

[[allowlists]]
description = "fake provider keys that tests and e2e mocks use to prove a key is never logged or echoed"
targetRules = ["generic-api-key"]
# Both must match: only these exact fake values in these files pass, any other key still fails.
condition = "AND"
paths = [
  '''^web/e2e-compose/provider\.ts$''',
  '''^web/e2e/provider\.spec\.ts$''',
  '''^services/torii/internal/transport/connectapi/providers_test\.go$''',
  '''^services/soroban/internal/transport/grpc/provider_test\.go$''',
  '''^pkg/llm/anthropic_test\.go$''',
]
regexes = [
  '''^e2e-key-0123456789$''',
  '''^sk-live-0123456789-SECRET$''',
  '''^sk-test-0123456789-SECRETWXYZ$''',
  '''^sk-very-secret-key-123456$''',
]
